// ------------------------------------------------------------ server
// `timeout` (ms) is for read-only calls: google.script.run never times out on its own.
function call(action, payload, timeout) {
  return new Promise((resolve, reject) => {
    let done = false;
    const t = timeout ? setTimeout(() => { if (!done) { done = true; reject(new Error('Server lambat merespons. Coba lagi.')); } }, timeout) : null;
    google.script.run
      .withSuccessHandler(r => { if (!done) { done = true; clearTimeout(t); resolve(r); } })
      .withFailureHandler(e => { if (!done) { done = true; clearTimeout(t); reject(e); } })
      .api(action, S.token, payload || null);
  });
}
const errMsg = e => ((e && e.message) || String(e)).replace(/^Error:\s*/, '');
const isSession = e => errMsg(e).indexOf('SESI_HABIS') >= 0;
function fail(e) {
  const m = (e && e.message) || String(e);
  if (m.indexOf('SESI_HABIS') >= 0) return signOut('Sesi berakhir. Silakan masuk lagi.');
  flash(m.replace(/^Error:\s*/, ''));
}

// ------------------------------------------------------------ clock & rules
function nowJ() {
  const d = new Date(Date.now() + S.skew + 7 * 3600e3);
  return { key: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() };
}
// Cutoff differs per collar; employee screens use the signed-in user's collar.
const COLLARS = ['white', 'blue'];
const myCollar = () => (S.user && S.user.collar) === 'blue' ? 'blue' : 'white';
function cutoffOf(k, collar) {
  const ws = addDays(k, -dow(k)), r = S.settings.cut[collar || myCollar()];
  return { key: addDays(ws, -r.days), min: hm(r.time), time: r.time, days: r.days };
}
// Week-level lock: the week's cutoff has passed.
function weekLocked(k, now, collar) {
  const c = cutoffOf(k, collar);
  return now.key > c.key || (now.key === c.key && now.min >= c.min);
}
// Day-level lock: also today and past days, which matters when the cutoff falls inside the meal week.
const isLocked = (k, now, collar) => k <= now.key || weekLocked(k, now, collar);
const cutInWeek = c => c.days <= 0;
const minsUntil = (c, now) => (k2t(c.key) - k2t(now.key)) / 6e4 + c.min - now.min;
const cutLabel = c => DAYS[dow(c.key)] + ' ' + dnum(c.key) + ' ' + MON[mnum(c.key)] + ', ' + c.time;
function leftTxt(m) {
  m = Math.max(1, Math.round(m));
  const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? d + ' hari ' + h + ' jam' : h ? h + ' jam ' + mm + ' menit' : mm + ' menit';
}
const blockOf = (list, k, meal) => list.find(c => c.date === k && (c.meal === 'both' || c.meal === meal)) || null;
const savedQ = (k, mk) => (S.saved[k] || {})[mk] || 0;
// Store location of a registered day (sent with the registration).
const savedSt = k => { const v = S.saved[k]; return v && (v.l || v.d) ? v.st || '' : ''; };
const selQ = (k, mk) => (S.sel[k] || {})[mk] || 0;
const mealStarted = (k, meal, now) => k < now.key || (k === now.key && now.min >= (meal === 'lunch' ? LUNCH_FB_FROM : DINNER_FB_FROM));
const fbOpen = (k, now) => now.key <= addDays(k, S.fbEditDays);

function pendingChanges(now) {
  const keys = {};
  Object.keys(S.sel).concat(Object.keys(S.saved)).forEach(k => { keys[k] = true; });
  const out = [];
  Object.keys(keys).sort().forEach(k => {
    if (isLocked(k, now)) return;
    const al = selQ(k, 'l'), ad = selQ(k, 'd'), bl = savedQ(k, 'l'), bd = savedQ(k, 'd');
    if (al !== bl || ad !== bd) out.push({ date: k, l: al, d: ad, n: (al !== bl) + (ad !== bd), delta: al - bl + ad - bd, add: (al >= bl && ad >= bd) });
  });
  return out;
}

let root, renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  const run = () => { if (!renderQueued) return; renderQueued = false; renderNow(); };
  requestAnimationFrame(run);

}
function renderNow() {
  const a = document.activeElement, f = a && a.dataset ? a.dataset.f : null;

  try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) { /* not a text input */ }
  const keep = {};
  root.querySelectorAll('[data-keep]').forEach(el => { keep[el.dataset.keep] = [el.scrollTop, el.scrollLeft]; });
  root.innerHTML = view();
  root.querySelectorAll('[data-keep]').forEach(el => { const v = keep[el.dataset.keep]; if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; } });
  if (f) {
    const el = root.querySelector('[data-f="' + f + '"]');
    if (el) { el.focus(); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) { /* no selection API */ } }
  }

  if (S.hr.wkScroll) { S.hr.wkScroll = false; const o = root.querySelector('.wk-opt.on') || root.querySelector('.wk-opt.cur'); if (o) o.scrollIntoView({ block: 'center' }); }

  ensureData();
}

// `act` adds a toast button: "Urungkan" by default, or `label` (e.g. "Coba lagi").

async function doLogin() {
  const nik = S.nik.replace(/\s/g, ''), nm = S.nm.trim();
  if (!nik) { S.loginErr = 'NIK wajib diisi.'; return render(); }
  if (!nm) { S.loginErr = 'Nama wajib diisi.'; return render(); }

// Applies bootstrap data. `stale` = from this browser's cache (shown instantly, refreshed right after).
// Later applies keep unsent edits and never overwrite registrations that are still being sent.
function applyBoot(d, stale, skew) {
  const first = !S.user;
  S.user = d.user; S.settings = d.settings; S.price = d.price; S.months = d.months; S.fbTags = d.fbTags; S.fbEditDays = d.fbEditDays;
  S.stores = d.stores || [];
  // Store picked on submit: the last one used in this browser, else the employee's own store.
  if (S.stores.indexOf(S.store) < 0) S.store = [ls.get('pm-store'), d.user.store].find(st => st && S.stores.indexOf(st) >= 0) || '';
  S.skew = stale ? (skew || 0) : d.now.ms - Date.now();
  if (first) {
    S.view = d.user.admin && ['recap', 'closure', 'voucher'].indexOf(ls.get('pm-view')) >= 0 ? ls.get('pm-view') : 'meal';
    S.saved = clone(d.reg); S.sel = clone(d.reg); S.mi = 0;
    const now = nowJ();
    S.hr.date = now.key; S.hr.ws = addDays(now.key, -dow(now.key)); S.hr.yms = [now.key.slice(0, 7)];
    S.hr.fbRange = { from: addDays(now.key, -13), to: now.key };
    S.cl.from = S.cl.to = now.key;
  } else if (!S.syncing) {
    const keep = {};
    pendingChanges(nowJ()).forEach(c => { keep[c.date] = { l: c.l, d: c.d }; });
    S.saved = clone(d.reg); S.sel = Object.assign(clone(d.reg), keep);
  }
  S.closures = d.closures; S.menus = d.menus;
  if (!S.syncing) S.myVouchers = d.vouchers || [];
  if (!S.syncing) S.fb = d.fb;
  S.bootData = d; S.booting = false;
  if (!stale) {
    S.bootAt = Date.now();
    persistBoot();
    if (first && d.user.admin) setTimeout(() => loadDay(S.hr.date), 1200);   // warm the admin day view
  }
  render();
}
function persistBoot() {
  if (!S.bootData || !S.token) return;
  ls.set('pm-boot', JSON.stringify({ t: S.token, skew: S.skew, d: Object.assign({}, S.bootData, { reg: S.saved, fb: S.fb }) }));
}
async function boot() { applyBoot(await call('bootstrap')); }

function thisWeekView(now) {

      (st ? '<span class="st-loc" title="Lokasi store">' + ICON.pin(13) + '<span class="ell">' + esc(st) + '</span></span>' : '') + '</div>';

    '<div style="overflow-x:auto" data-keep="tw"><div class="tw">' + cards + '</div></div></div>';

function monthTotals(ym, now) {
  let l = 0, d = 0, closed = 0, editable = 0;
  daysOf(ym + '-01', monthEnd(ym)).forEach(k => {
    const lb = blockOf(S.closures, k, 'lunch'), db = blockOf(S.closures, k, 'dinner');
    if (lb && db) { closed++; return; }
    const lk = isLocked(k, now);
    if (!lk) editable++;
    const src = lk ? S.saved : S.sel, v = src[k] || {};
    if (!lb) l += v.l || 0;
    if (!db) d += v.d || 0;
  });
  return { l, d, closed, editable };
}

function monthStatus(ym, now, pend) {
  const t = monthTotals(ym, now), n = t.l + t.d, draft = pend.some(c => c.date.slice(0, 7) === ym);
  if (draft) return { sub: (n ? n + ' porsi · ' : '') + 'Draf', pill: 'Draf', cls: 'st-draft', t };
  if (!t.editable) return { sub: (n ? n + ' porsi · ' : '') + 'Terkunci', pill: 'Terkunci', cls: 'st-lock', t };
  if (n) return { sub: n + ' porsi · Terkirim', pill: 'Terkirim', cls: 'st-sent', t };
  return { sub: 'Belum dipilih', pill: 'Belum dipilih', cls: 'st-lock', t };
}

function nextOpenWeek(now) {
  let ws = addDays(now.key, -dow(now.key));
  for (let i = 0; i < 6 && weekLocked(ws, now); i++) ws = addDays(ws, 7);
  return ws;
}

function lockBarView(now) {

  const head = soon ? 'Minggu ' + weekRange(ws) + ' terkunci dalam ' + leftTxt(m) + '.' : 'Minggu ' + weekRange(ws) + ' masih bisa diubah sampai ' + cutLabel(c) + '.';
  const text = (soon ? 'Setelah itu pilihan minggu tersebut tidak bisa diubah, dan pilihan yang belum dikirim tidak tercatat.' : 'Minggu yang sudah lewat batas tidak bisa diubah lagi.') +
    (cutInWeek(c) ? ' Hari ini dan hari yang sudah lewat selalu terkunci.' : '');
  return '<div class="lockbar' + (soon ? ' lk' : '') + '">' + ICON.clock(18) + '<span><strong>' + head + '</strong> ' + text + '</span></div>';
}

function calendarView(ym, now) {
  const today = now.key, first = ym + '-01', last = monthEnd(ym), nd = S.hideWknd ? 5 : 7;
  const cols = S.hideWknd ? '130px repeat(5,minmax(110px,1fr))' : '130px repeat(7,minmax(96px,1fr))';
  let h = '<div class="cal" data-keep="cal"><div class="cal-g" style="grid-template-columns:' + cols + ';min-width:' + (S.hideWknd ? 700 : 860) + 'px"><span style="border-bottom:1px solid #e3e6e1"></span>';
  h += DAYS.slice(0, nd).map((d, i) => '<span class="cal-dh" style="color:' + (i >= 5 ? '#5d6560' : '#1d211f') + '">' + d + '</span>').join('');
  for (let ws = addDays(first, -dow(first)); ws <= last; ws = addDays(ws, 7)) {
    const we = addDays(ws, 6), days = daysOf(ws, we), lk = weekLocked(ws, now), c = cutoffOf(ws);
    const label = ws <= today && today <= we && lk ? 'Minggu ini · terkunci' : we < today ? 'Lewat' : lk ? 'Terkunci' : c.key === today ? 'Batas hari ini ' + c.time : 'Sampai ' + DAYS[dow(c.key)] + ' ' + dnum(c.key) + ' ' + MON[mnum(c.key)];
    let n = 0;
    days.forEach(k => {
      if (k.slice(0, 7) !== ym || k < today) return;
      const src = isLocked(k, now) ? S.saved : S.sel, v = src[k] || {};
      if (!blockOf(S.closures, k, 'lunch')) n += v.l || 0;
      if (!blockOf(S.closures, k, 'dinner')) n += v.d || 0;
    });
    const editable = !lk && days.some(k => k.slice(0, 7) === ym && k > today);
    h += '<div class="cal-wk"><span class="lb" style="color:' + (we < today ? '#5d6560' : '#1d211f') + '">' + label + '</span>' +
      (we >= today ? '<div class="sum"><span>' + n + ' porsi</span><b>' + rp(n * S.price) + '</b></div>' : '') +
      (editable ? '<div class="lk"><button class="link sm" data-a="fillWeek" data-ws="' + ws + '">Isi minggu</button><button class="link sm muted" style="font-weight:400" data-a="clearWeek" data-ws="' + ws + '">Kosongkan</button></div>' : '') + '</div>';
    h += days.slice(0, nd).map(k => cellView(k, ym, now)).join('');
  }
  return h + '</div></div>';
}

function cellView(k, ym, now) {
  const num = dnum(k);
  if (k.slice(0, 7) !== ym) return '<div class="cell dim out"><div class="cell-h" style="opacity:.5"><b>' + num + '</b></div></div>';
  const past = k < now.key, lk = isLocked(k, now), isT = k === now.key;
  const lb = blockOf(S.closures, k, 'lunch'), db = blockOf(S.closures, k, 'dinner'), full = lb && db;
  const cls = (past ? ' dim past' : full ? ' closed' : '') + (isT ? ' today' : '');
  let tag = '', tagFg = '#8a5a0b';
  if (full) tag = /libur|cuti/i.test(lb.reason) ? 'Libur' : 'Tutup';
  else if (lb || db) tag = lb ? 'Siang tutup' : 'Malam tutup';
  else if (lk && !past) { tag = 'Terkunci'; tagFg = '#5d6560'; }
  const chips = MEALS.map(([mk, name, meal]) => {
    const blk = meal === 'lunch' ? lb : db;
    if (blk) return '<button class="mc cls" disabled title="' + esc(name + ' · ' + blk.reason) + '"><span>' + name + '</span></button>';
    if (lk) {
      const q = savedQ(k, mk);
      return '<button class="mc lk' + (q ? ' reg' : '') + (mk === 'd' ? ' dn' : '') + '" disabled title="' + name + (q ? ' · terdaftar' : '') + ' · terkunci"><span>' + name + (q > 1 ? ' ×' + q : '') + '</span></button>';
    }
    const q = selQ(k, mk), sq = savedQ(k, mk);
    const st = q === sq ? (q ? 'reg' : '') : q ? 'pend' : 'pend rm';
    const title = st === 'reg' ? 'terdaftar' : st === 'pend' ? 'belum dikirim' : st === 'pend rm' ? 'akan dihapus setelah dikirim' : 'belum dipilih';
    const shown = q || sq;

// Cost of newly added portions per month in the pending changes, and how a voucher splits over it.
function addedByMonth(pend) {
  const m = {};
  pend.forEach(c => {
    const n = Math.max(0, c.l - savedQ(c.date, 'l')) + Math.max(0, c.d - savedQ(c.date, 'd'));
    if (n) m[c.date.slice(0, 7)] = (m[c.date.slice(0, 7)] || 0) + n * S.price;
  });
  return m;
}
function splitVoucher(value, added) {
  let left = value;
  const out = {};
  Object.keys(added).sort().forEach(k => { const t = Math.min(left, added[k]); if (t) { out[k] = t; left -= t; } });
  return out;
}
const sumObj = o => Object.keys(o).reduce((a, k) => a + o[k], 0);
const voucherFor = ym => S.myVouchers.reduce((a, v) => a + (v.split[ym] || 0), 0);

function voucherBox(pend) {

// Store rows A–Z by name, "Tanpa store" last.
const byStoreName = (a, b) => (a === 'Tanpa store') - (b === 'Tanpa store') || a.localeCompare(b, 'id', { sensitivity: 'base', numeric: true });
function storeAgg(stores, split) {
  const t = [0, 0, 0, 0];
  const rows = stores.slice().sort(byStoreName).map(st => { const v = split[st] || [0, 0, 0, 0]; v.forEach((n, i) => { t[i] += n; }); return { store: st, v, total: v[0] + v[1] + v[2] + v[3] }; });
  return { rows, t, total: t[0] + t[1] + t[2] + t[3] };
}
// `cross` (store -> [siang, malam]) counts portions eaten at a store by employees whose own store is another one.
function splitOfRows(rows, stores) {
  const sp = {}, cross = {}, list = stores.slice();
  list.forEach(s => { sp[s] = [0, 0, 0, 0]; });
  rows.forEach(r => {
    if (!sp[r.store]) { sp[r.store] = [0, 0, 0, 0]; list.push(r.store); }
    const o = r.collar === 'white' ? 0 : 2;
    sp[r.store][o] += r.l; sp[r.store][o + 1] += r.d;
    if (r.home && r.home !== r.store) { const c = cross[r.store] || (cross[r.store] = [0, 0]); c[0] += r.l; c[1] += r.d; }
  });
  return Object.assign(storeAgg(list, sp), { cross });
}

function daySums(day) {
  let l = 0, d = 0, pl = 0, pd = 0;
  day.rows.forEach(r => { l += r.l; d += r.d; if (r.l) pl++; if (r.d) pd++; });

}

// Days before the meal week's Monday -> weekday name: 5 = Rabu minggu sebelumnya … 1 = Minggu, 0 = Senin … -2 = Rabu minggu makan.
const cutDay = n => FD[(7 - n) % 7];
const cutWeek = n => n > 0 ? 'sebelum minggu makan' : 'di minggu makan';
const CUT_DAYS = [5, 4, 3, 2, 1, 0, -1, -2];
function cutInfo(k, now) {
  const ws = addDays(k, -dow(k)), cs = S.settings.cut;
  const when = c => FD[dow(c.key)] + ' ' + dnum(c.key) + ' ' + FMN[mnum(c.key)] + ', ' + c.time;
  const ruleOf = r => 'setiap ' + cutDay(r.days) + ' ' + cutWeek(r.days) + ' pukul ' + r.time;
  const p = COLLARS.map(col => { const c = cutoffOf(k, col); return { col, c, lk: weekLocked(k, now, col) }; });
  const same = cs.white.days === cs.blue.days && cs.white.time === cs.blue.time;
  const rule = same ? 'Batas: ' + ruleOf(cs.white) : 'Batas white collar: ' + ruleOf(cs.white) + ' · blue collar: ' + ruleOf(cs.blue);
  if (k < now.key) return { head: 'Sudah lewat · data final', short: 'Sudah lewat', sub: rule, lk: true };
  if (k === now.key) return { head: 'Hari ini · porsi sudah pasti', short: 'Porsi sudah pasti', sub: rule, lk: true };
  const allLk = p.every(x => x.lk), anyLk = p.some(x => x.lk);
  if (same) {
    const c = p[0].c;
    if (allLk) return { head: 'Porsi sudah pasti · pendaftaran minggu ' + weekRange(ws) + ' ditutup ' + when(c), short: 'Porsi sudah pasti', sub: rule, lk: true };
    return { head: 'Masih bisa berubah · ditutup ' + when(c) + ' (' + leftTxt(minsUntil(c, now)) + ' lagi)', short: 'Masih bisa berubah', sub: rule, lk: false };
  }
  const part = x => collarName(x.col) + (x.lk ? ' sudah pasti' : ' ditutup ' + when(x.c) + ' (' + leftTxt(minsUntil(x.c, now)) + ' lagi)');
  if (allLk) return { head: 'Porsi sudah pasti · pendaftaran minggu ' + weekRange(ws) + ' ditutup', short: 'Porsi sudah pasti', sub: rule, lk: true };
  return { head: (anyLk ? 'Sebagian masih bisa berubah · ' : 'Masih bisa berubah · ') + p.map(part).join(' · '), short: anyLk ? 'Sebagian masih bisa berubah' : 'Masih bisa berubah', sub: rule, lk: false };
}

// Whether a day's portions can still change: final (today/past), fixed (both collars past cutoff), part (one collar), open.
function dayLock(k, now) {
  if (k <= now.key) return { st: 'final', tip: k < now.key ? 'Sudah lewat · data final' : 'Hari ini · porsi sudah pasti' };
  const p = COLLARS.map(col => ({ col, lk: weekLocked(k, now, col), c: cutoffOf(k, col) }));
  const tip = p.map(x => collarName(x.col) + (x.lk ? ' sudah pasti' : ' ditutup ' + cutLabel(x.c))).join(' · ');
  return { st: p.every(x => x.lk) ? 'fixed' : p.some(x => x.lk) ? 'part' : 'open', tip };
}

// "▲ +12 (+8%) vs minggu lalu"; the previous total is in the tooltip.
function deltaView(cur, prev, label) {

function detailRows(day) {

  return day.rows.filter(r => (H.meal === 'all' || (H.meal === 'lunch' ? r.l : r.d)) && (H.store === 'all' || r.store === H.store) &&
    (!q || (r.name + ' ' + r.nik + ' ' + r.dept + ' ' + r.store).toLowerCase().indexOf(q) >= 0))
    .sort((a, b) => { const va = a[so.k], vb = b[so.k]; return ((typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb))) * so.dir) || a.name.localeCompare(b.name); });

// Month picker options and the months it currently stands for (empty selection = all).
function monthOpts() { const cur = nowJ().key.slice(0, 7), o = []; for (let i = -6; i <= 2; i++) o.push(addMonths(cur, i)); return o; }
function selMonths() { const o = monthOpts(), f = o.filter(y => S.hr.yms.indexOf(y) >= 0); return f.length ? f : o; }
function monthAgg(yms) {
  const days = [], stores = [], split = {};
  yms.forEach(y => {
    const m = S.hr.monthCache[y];
    days.push.apply(days, m.days);
    m.stores.forEach(st => {
      if (stores.indexOf(st) < 0) stores.push(st);
      const v = m.split[st] || [0, 0, 0, 0], cur = split[st] || [0, 0, 0, 0];

}

// Days of a weekly/monthly recap narrowed to one store ('all' = every store): per-day totals, store split

function rangeData(m, store) {
  const split = {}, cross = {}, all = m.stores.slice();
  const days = m.days.map(x => {
    let l = 0, d = 0;
    Object.keys(x.s || {}).forEach(st => {
      const v = x.s[st];
      if (all.indexOf(st) < 0) all.push(st);
      if (store !== 'all' && st !== store) return;
      split[st] = (split[st] || [0, 0, 0, 0]).map((n, i) => n + v[i]);
      cross[st] = (cross[st] || [0, 0]).map((n, i) => n + v[4 + i]);
      l += v[0] + v[2]; d += v[1] + v[3];

    return Object.assign({}, x, { l, d });

// Weeks run Monday–Sunday; S.hr.ws is the Monday. Same date limits as the daily view.
const weekMin = now => addDays(now.key, -400), weekMax = now => addDays(now.key, 120);

}

}

}

function periodTitle(a, b) {

}
function tally(list) {

  list.forEach(e => { c[e.r]++; e.tags.forEach(g => { if (g !== 'Menu favorit') t[g] = (t[g] || 0) + 1; }); });

}

// ------------------------------------------------------------ range date picker
// Port of the design system's date-picker.tsx: two months, click a start then an end date,
// presets underneath. One picker is open at a time (S.dp).
const DP_WD = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const fmtD = k => dnum(k) + ' ' + MON[mnum(k)] + ' ' + k.slice(0, 4);
const spanDays = (a, b) => Math.round((k2t(b) - k2t(a)) / 864e5) + 1;
const firstOf = (k, n) => addMonths(k.slice(0, 7), n || 0) + '-01';
function sameDayMonthsAgo(k, n) {
  const f = firstOf(k, -n), last = dnum(monthEnd(f.slice(0, 7)));
  return f.slice(0, 8) + String(Math.min(dnum(k), last)).padStart(2, '0');
}
function dpConfig(id) {
  const today = nowJ().key, ym = today.slice(0, 7), mon = addDays(today, -dow(today)), sun = addDays(mon, 6);
  if (id === 'cl') return {
    get: () => ({ from: S.cl.from, to: S.cl.to < S.cl.from ? S.cl.from : S.cl.to }),
    set: r => { S.cl.from = r.from; S.cl.to = r.to; },
    min: today, max: addDays(today, 365), maxDays: 120, future: true,
    presets: [['Hari ini', today, today], ['Besok', addDays(today, 1), addDays(today, 1)], ['Sisa minggu ini', today, sun],
      ['Minggu depan', addDays(sun, 1), addDays(sun, 7)], ['Sisa bulan ini', today, monthEnd(ym)], ['Bulan depan', firstOf(today, 1), monthEnd(addMonths(ym, 1))]]
  };
  return {
    get: () => S.hr.fbRange,
    set: r => { S.hr.fbRange = r; S.hr.fbSel = null; },
    min: addDays(today, -730), max: today, maxDays: 92, future: false,
    presets: [['Hari ini', today, today], ['Minggu ini', mon, today], ['Minggu lalu', addDays(mon, -7), addDays(mon, -1)],
      ['Bulan ini', ym + '-01', today], ['14 hari terakhir', addDays(today, -13), today], ['1 bulan terakhir', addDays(sameDayMonthsAgo(today, 1), 1), today]]
  };
}
function dpTrigger(id, width) {
  const r = dpConfig(id).get(), open = !!S.dp && S.dp.id === id;
  return '<button type="button" class="dp-trig' + (open ? ' open' : '') + '" data-a="dpOpen" data-k="' + id + '" aria-haspopup="dialog" aria-expanded="' + open + '" style="width:' + width + '">' +
    '<span class="ell">' + fmtD(r.from) + ' – ' + fmtD(r.to) + '</span><span class="dp-caret" aria-hidden="true">▾</span></button>';
}
function dpMonth(first, side, c) {
  const left = S.dp.view, startWd = new Date(k2t(first)).getUTCDay(), n = dnum(monthEnd(first.slice(0, 7)));
  const prevOk = firstOf(left, -1) >= firstOf(c.min), nextOk = firstOf(left, 2) <= firstOf(c.max);
  const nav = side === 'left'
    ? '<span class="dp-nav"><button type="button" data-a="dpNav" data-n="-12" aria-label="Tahun sebelumnya"' + (prevOk ? '' : ' disabled') + '>«</button><button type="button" data-a="dpNav" data-n="-1" aria-label="Bulan sebelumnya"' + (prevOk ? '' : ' disabled') + '>‹</button></span>'
    : '<span class="dp-nav"><button type="button" data-a="dpNav" data-n="1" aria-label="Bulan berikutnya"' + (nextOk ? '' : ' disabled') + '>›</button><button type="button" data-a="dpNav" data-n="12" aria-label="Tahun berikutnya"' + (nextOk ? '' : ' disabled') + '>»</button></span>';
  let cells = '';
  for (let i = 0; i < startWd; i++) cells += '<span class="dp-cell"></span>';
  for (let d = 1; d <= n; d++) {
    const k = first.slice(0, 8) + String(d).padStart(2, '0'), off = k < c.min || k > c.max;
    cells += '<span class="dp-cell" data-dpc="' + k + '"><button type="button" class="dp-day" data-a="dpDay" data-dpd="' + k + '" aria-label="' + fmtD(k) + '"' + (off ? ' disabled' : '') + '>' + d + '</button></span>';
  }
  return '<div class="dp-month"><div class="dp-head">' + (side === 'left' ? nav : '<span class="dp-sp"></span>') + '<b>' + FMN[mnum(first)] + ' ' + first.slice(0, 4) + '</b>' + (side === 'right' ? nav : '<span class="dp-sp"></span>') + '</div>' +
    '<div class="dp-wd">' + DP_WD.map(w => '<span>' + w + '</span>').join('') + '</div><div class="dp-grid">' + cells + '</div></div>';
}
function dpView() {
  const P = S.dp;
  if (!P) return '';
  const c = dpConfig(P.id), r = c.get();
  const hint = P.pending ? 'Mulai: ' + fmtD(P.pending) + ' — sekarang pilih tanggal akhir' : 'Klik tanggal mulai, lalu tanggal akhir (maks. ' + c.maxDays + ' hari).';
  const list = c.presets.filter(p => spanDays(p[1], p[2]) <= c.maxDays);
  const offP = p => p[1] > p[2] || p[1] < c.min || p[2] > c.max;
  const active = list.findIndex(p => !offP(p) && p[1] === r.from && p[2] === r.to);   // only the first match is highlighted
  const presets = list.map((p, i) => {
    const off = offP(p), on = i === active;
    return '<button type="button" data-a="dpPreset" data-i="' + i + '"' + (off ? ' disabled' : '') + (on ? ' class="on"' : '') + '>' + p[0] + '</button>';
  }).join('');
  return '<div class="dp-layer" data-a="dpClose"></div><div class="dp-pop" role="dialog" aria-label="Pilih periode" style="left:' + P.pos.left + 'px;top:' + P.pos.top + 'px;width:' + P.pos.width + 'px">' +
    '<div class="dp-months">' + dpMonth(P.view, 'left', c) + dpMonth(firstOf(P.view, 1), 'right', c) + '</div>' +
    '<div class="dp-foot"><p class="dp-hint">' + hint + '</p><div class="dp-presets">' + presets + '</div></div></div>';
}
// Range band and end circles, painted on the existing DOM so hovering doesn't rebuild the page.
function dpPaint() {
  const P = S.dp, pop = root.querySelector('.dp-pop');
  if (!P || !pop) return;
  const h = pop.offsetHeight, vh = window.innerHeight;       // keep the whole popover on screen (months stack on phones)
  if (P.pos.top + h > vh - 8) { P.pos.top = Math.max(8, vh - 8 - h); pop.style.top = P.pos.top + 'px'; }
  const r = dpConfig(P.id).get();
  const sh = P.pending ? (P.hover ? { from: P.pending < P.hover ? P.pending : P.hover, to: P.pending < P.hover ? P.hover : P.pending } : { from: P.pending, to: P.pending }) : r;
  const multi = sh.from !== sh.to;
  pop.querySelectorAll('[data-dpc]').forEach(cell => {
    const k = cell.dataset.dpc, start = k === sh.from, end = k === sh.to;
    cell.style.background = k > sh.from && k < sh.to ? '#f0f2ee'
      : multi && start ? 'linear-gradient(to right, transparent 50%, #f0f2ee 50%)'
      : multi && end ? 'linear-gradient(to left, transparent 50%, #f0f2ee 50%)' : '';
    const b = cell.firstChild;
    b.classList.toggle('end', start || end);
    b.setAttribute('aria-pressed', String(start || end));

function parseVouchers(text) {

  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length && /[a-z]/i.test((lines[0].split(/[,;\t]/)[1] || '')) && !/\d/.test(lines[0].split(/[,;\t]/)[1] || '')) lines.shift();
  return lines.map(l => {
    const c = l.split(/[,;\t]/).map(x => x.trim().replace(/^"|"$/g, ''));
    const code = (c[0] || '').toUpperCase().replace(/\s+/g, ''), value = parseRp(c[1]), until = parseDay(c[2]);
    const err = !CODE_RE.test(code) ? 'Kode tidak valid' : !(value > 0 && value <= 10000000) ? 'Nilai tidak valid' : until === null ? 'Tanggal tidak valid'
      : seen[code] ? 'Duplikat di file' : have[code] ? 'Sudah ada' : '';

}

function load(key, action, payload, apply) {

  S.loading[key] = true;
  call(action, payload)
    .then(d => { S.loading[key] = false; if (d && typeof d === 'object' && !Array.isArray(d)) d._at = Date.now(); apply(d); render(); })
    .catch(e => { S.loading[key] = false; S.loadErr[key] = Date.now(); fail(e); });
}
const fresh = (d, ms) => d && Date.now() - (d._at || 0) < ms;
function loadDay(k) {

function ensureData() {

  submit() {

    const tentative = vch ? { code: vch.code, split: splitVoucher(vch.value, added), pending: true } : null;
    if (tentative) { tentative.discount = sumObj(tentative.split); S.myVouchers.push(tentative); S.voucher = null; }

  quick(v) {
    if (!v) return;
    const now = nowJ(), ym = S.months[S.mi], days = daysOf(ym + '-01', monthEnd(ym)).filter(k => !isLocked(k, now));
    if (v === 'clear') return clearDays(days, monthName(ym));
    const parts = v.split('-'), ds = days.filter(k => parts[0] === 'all' || dow(k) < 5);
    ds.forEach(k => fillDay(k, parts[1], now));
    flash(monthName(ym) + ' diisi · ' + ds.length + ' hari');
  },
  rStore(v) { S.hr.rStore = v; render(); },
  hrDate(v) { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { S.hr.date = v; render(); } },
  hrMeal(v) { S.hr.meal = v; render(); },
  hrStore(v) { S.hr.store = v; render(); },
  cutD(v, el) { S.hr.cut[el.dataset.k].days = Number(v); },
  cutT(v, el) { S.hr.cut[el.dataset.k].time = v; },
  clSkip(v, el) { S.cl.skip = el.checked; render(); },
  vcStatus(v) { S.vc.status = v; render(); },
  vcFile(v, el) {
    const f = el.files && el.files[0];
    if (!f) return;
    if (f.size > 2e6) return flash('File terlalu besar (maks. 2 MB).');
    const rd = new FileReader();
    rd.onload = () => { S.vc.text = String(rd.result || ''); S.vc.fileName = f.name; render(); };
    rd.onerror = () => flash('File tidak bisa dibaca.');
    rd.readAsText(f);
  }
};

// chip click, drag-to-paint
function chipOf(el) { const c = el && el.closest && el.closest('[data-chip]'); if (!c) return null; const p = c.dataset.chip.split('|'); return { el: c, k: p[0], mk: p[1] }; }
function paint(k, mk, on) {
  const now = nowJ();
  if (!canEdit(k, mk, now)) return;
  setQty(k, mk, on ? Math.max(1, selQ(k, mk)) : 0);
}

// ------------------------------------------------------------ wiring
function init() {
  root = document.getElementById('app');
  root.addEventListener('click', e => {
    if (S.ms && !e.target.closest('[data-ms-root]')) { S.ms = null; render(); }
    if (S.storeOpen && !e.target.closest('[data-store-root]')) { closeStore(); render(); }
    if (S.hr.wkOpen && !e.target.closest('[data-wk-root]')) { S.hr.wkOpen = false; render(); }
    if (S.hr.dl && (!e.target.closest('[data-dl-root]') || e.target.closest('.dl-opt'))) { S.hr.dl = false; render(); }
    const c = chipOf(e.target);
    if (c) {
      if (S.suppress) { S.suppress = false; return; }
      if (selQ(c.k, c.mk) > 0) openPop(c.el, c.k, c.mk); else setQty(c.k, c.mk, 1);
      return render();
    }
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled || !A[el.dataset.a]) return;
    A[el.dataset.a](el, e);
  });
  root.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el.value, el); });
  root.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el.value, el); });
  root.addEventListener('submit', e => { e.preventDefault(); if (e.target.dataset.submit === 'login') doLogin(); });
  root.addEventListener('mousedown', e => {
    const c = chipOf(e.target);
    if (c && e.button === 0) S.drag = { mk: c.mk, val: !(selQ(c.k, c.mk) > 0), start: c.k, moved: false };
  });
  root.addEventListener('mouseover', e => {
    const g = S.drag, c = chipOf(e.target);
    if (!g || !c || c.mk !== g.mk || c.k === g.start) return;
    if (!g.moved) { g.moved = true; paint(g.start, g.mk, g.val); }
    paint(c.k, c.mk, g.val);
    render();
  });
  window.addEventListener('mouseup', () => { if (S.drag && S.drag.moved) { S.suppress = true; setTimeout(() => { S.suppress = false; }, 0); } S.drag = null; });
  window.addEventListener('scroll', e => {
    if (S.pop) { S.pop = null; render(); }
    if (S.dp && !(e.target && e.target.closest && e.target.closest('.dp-pop'))) { S.dp = null; render(); }
  }, true);
  root.addEventListener('mouseover', e => {               // range preview while picking the end date (no re-render)
    if (!S.dp || !S.dp.pending) return;
    const d = e.target.closest && e.target.closest('[data-dpd]');
    const h = d && !d.disabled ? d.dataset.dpd : null;
    if (h !== S.dp.hover) { S.dp.hover = h; dpPaint(); }
  });
  window.addEventListener('resize', () => { if (S.pop) S.pop = null; if (S.user) render(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.in === 'vcode') { e.preventDefault(); return A.vApply(); }
    if (S.storeOpen && e.target && e.target.dataset && e.target.dataset.in === 'storeQ') {
      const list = storeMatches();
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        S.storeHi = Math.max(0, Math.min(list.length - 1, Math.min(S.storeHi, list.length - 1) + (e.key === 'ArrowDown' ? 1 : -1)));
        render();
        setTimeout(() => { const o = root.querySelector('.sbox-opt.hi'); if (o) o.scrollIntoView({ block: 'nearest' }); }, 60);
        return;
      }
      if (e.key === 'Enter') { e.preventDefault(); const st = list[Math.min(S.storeHi, list.length - 1)]; if (st) pickStore(st); return; }
    }
    if (e.key !== 'Escape') return;
    if (S.storeOpen) { closeStore(); return render(); }
    if (S.hr.wkOpen || S.hr.dl) { S.hr.wkOpen = false; S.hr.dl = false; return render(); }
    if (S.ms) { S.ms = null; return render(); }
    if (S.dp) { S.dp = null; return render(); }
    if (S.pop) { S.pop = null; render(); } else if (S.fbDraft) { S.fbDraft = null; render(); } else if (S.hr.print) { S.hr.print = false; render(); }
  });
  window.addEventListener('beforeunload', e => { if (S.user && (S.syncing || pendingChanges(nowJ()).length)) { e.preventDefault(); e.returnValue = ''; } });
  // Coming back to an open tab refreshes quietly if the data is more than 2 minutes old.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && !S.syncing && Date.now() - S.bootAt > 120000) refreshEmployee(); });
  setInterval(() => { if (S.user && !S.drag) render(); }, 30000);

  if (S.token) {
    let cached = null;
    try { cached = JSON.parse(ls.get('pm-boot') || 'null'); } catch (e) { cached = null; }
    // Skips caches saved before the per-collar cutoff (settings.cut) existed.
    if (cached && cached.t === S.token && cached.d && cached.d.settings && cached.d.settings.cut) applyBoot(cached.d, true, cached.skew);
    boot().catch(e => {
      S.booting = false;
      if (isSession(e) || !S.user) return isSession(e) ? fail(e) : signOut('');
      flash('Belum bisa memuat data terbaru · ' + errMsg(e), () => refreshEmployee(), 'Coba lagi');
    });
  }
  else { S.booting = false; render(); }
}

init();
})();
</script>
